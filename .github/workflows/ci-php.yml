name: PHP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, gmp, bcmath, openssl
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: |
          if [ "${{ matrix.php-version }}" = "8.4" ]; then
            composer install --prefer-dist --no-progress
          else
            composer update --prefer-dist --no-progress --prefer-stable
          fi

      - name: Run Tests
        run: vendor/bin/phpunit

  deploy:
    name: Trigger Packagist Sync
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          curl -XPOST -H "Content-Type: application/json" \
            -d "{\"repository\":{\"url\":\"https://github.com/${{ github.repository }}\"}}" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}"
        # Note : Vous devez définir PACKAGIST_USERNAME et PACKAGIST_API_TOKEN dans les secrets de votre dépôt.
