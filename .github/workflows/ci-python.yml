name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'src/python/requirements-test.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/python/requirements-test.txt

    - name: Run tests with pytest
      run: |
        # Se déplace dans le répertoire python pour s'aligner sur la configuration de sys.path du test_engine.py
        cd src/python
        python -m pytest tests/ -v