[package]
name = "fingerprint-wasm"
version = "1.0.0"
edition = "2021"
description = "High-performance WebAssembly cryptographic and PoW engine for fingerprinting"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false