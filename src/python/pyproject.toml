[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonympins-fingerprint"
version = "0.6.8"
authors = [
    { name = "anonympins" }
]
description = "A high-performance cryptographic fingerprint and useful Proof-of-Work (uPoW) engine."
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/anonympins/fingerprint"
Repository = "https://github.com/anonympins/fingerprint"
Issues = "https://github.com/anonympins/fingerprint/issues"

[tool.setuptools.packages.find]
where = ["."]